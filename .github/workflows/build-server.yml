name: Build Server

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the Windows and macOS servers (needs the windows-signing and macos-signing environments)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false

jobs:
  build-server:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact-name: server-linux
            executable-name: server
          - os: windows-latest
            platform: win
            artifact-name: server-win
            executable-name: server.exe
          # PyInstaller builds for the CPU it runs on, so each macOS
          # architecture gets its own runner and its own server binary.
          - os: macos-latest
            platform: mac
            artifact-name: server-mac-arm64
            executable-name: server
          - os: macos-15-intel
            platform: mac
            artifact-name: server-mac-x64
            executable-name: server

    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.sign && (matrix.platform == 'win' && 'windows-signing' || matrix.platform == 'mac' && 'macos-signing') || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "server/.python-version"

      - name: Install server dependencies
        working-directory: server
        shell: bash
        run: uv sync --all-extras

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 .github/scripts/set-version.py

      # cryptography publishes no macOS Intel wheel, so uv builds it from source
      # there and links the runner's libssl dynamically; PyInstaller then bundles
      # a different libssl and the server fails to import it. Build it with
      # OpenSSL linked statically instead.
      - name: Build cryptography with static OpenSSL (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        working-directory: server
        shell: bash
        run: |
          version="$(uv pip show cryptography | awk '/^Version:/ {print $2}')"
          OPENSSL_STATIC=1 OPENSSL_DIR="$(brew --prefix openssl@3)" \
            uv pip install --reinstall --no-cache --no-binary cryptography --no-deps "cryptography==${version}"
          so="$(find .venv -name '_rust.abi3.so' -path '*cryptography*' | head -n 1)"
          otool -L "$so"
          if otool -L "$so" | grep -Eq 'libssl|libcrypto'; then
            echo "::error::cryptography still links libssl or libcrypto dynamically"
            exit 1
          fi

      - name: Build server executable
        working-directory: server
        shell: bash
        run: |
          uv run --no-sync pyinstaller sigilweaver.spec

      - name: Verify executable exists
        working-directory: server
        shell: bash
        run: |
          if [ -f "dist/${{ matrix.executable-name }}" ]; then
            echo "Server executable built successfully"
            ls -lh dist/${{ matrix.executable-name }}
          else
            echo "ERROR: Server executable not found"
            exit 1
          fi

      # Informational: the oldest macOS the server runs on. It should not exceed
      # bundle.macOS.minimumSystemVersion in studio/tauri/tauri.conf.json.
      - name: Report the server's minimum macOS version
        if: runner.os == 'macOS'
        working-directory: server
        shell: bash
        run: otool -l dist/server | grep -E -A3 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'minos|version' | head -n 4

      # Signed builds: the standalone server downloads are signed too. On macOS
      # it gets the Developer ID signature with the hardened runtime and the
      # Studio entitlements (the same PyInstaller needs), then notarization. A
      # bare binary cannot hold a stapled ticket; Gatekeeper checks it online.
      - name: Sign and notarize the server (macOS)
        if: matrix.platform == 'mac' && inputs.sign
        working-directory: server
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/server-signing.keychain-db"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          zip="$RUNNER_TEMP/server.zip"
          trap 'security delete-keychain "$kc" 2>/dev/null || true; rm -f "$key" "$RUNNER_TEMP/cert.p12" "$zip"' EXIT
          kcpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          codesign --force --timestamp --options runtime \
            --entitlements ../studio/tauri/entitlements.plist \
            --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" dist/server
          codesign --verify --strict --verbose=2 dist/server
          codesign -d --verbose=2 dist/server 2>&1 | grep -E '^(Authority=Developer ID Application|TeamIdentifier|flags)'
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          ditto -c -k dist/server "$zip"
          for i in 1 2 3; do
            if out="$(xcrun notarytool submit "$zip" --key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 90m 2>&1)"; then
              echo "$out"
              echo "$out" | grep -q 'status: Accepted' && exit 0
              echo "::error::notarization did not end Accepted"; exit 1
            fi
            echo "$out"; echo "notarytool attempt $i failed; retrying in 60s"; sleep 60
          done
          echo "::error::notarization failed after 3 attempts"; exit 1

      - name: Install the Artifact Signing module (Windows)
        if: matrix.platform == 'win' && inputs.sign
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser

      - name: Sign the server (Windows)
        if: matrix.platform == 'win' && inputs.sign
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: ./scripts/sign-windows.ps1 server/dist/server.exe

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: server/dist/${{ matrix.executable-name }}
          if-no-files-found: error
          retention-days: 7
