name: Build Server

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.13"

jobs:
  build-server:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: server-linux
            executable-name: server
          - os: windows-latest
            artifact-name: server-win
            executable-name: server.exe
          - os: macos-latest
            artifact-name: server-mac
            executable-name: server

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "server/.python-version"

      - name: Install server dependencies
        working-directory: server
        shell: bash
        run: uv sync --all-extras

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 .github/scripts/set-version.py

      - name: Build server executable
        working-directory: server
        shell: bash
        run: |
          uv run pyinstaller sigilweaver.spec

      - name: Verify executable exists
        working-directory: server
        shell: bash
        run: |
          if [ -f "dist/${{ matrix.executable-name }}" ]; then
            echo "Server executable built successfully"
            ls -lh dist/${{ matrix.executable-name }}
          else
            echo "ERROR: Server executable not found"
            exit 1
          fi

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: server/dist/${{ matrix.executable-name }}
          if-no-files-found: error
          retention-days: 7
