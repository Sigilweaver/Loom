name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            server/uv.lock
            hub/backend/uv.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "server/.python-version"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Server dependencies
        run: cd server && uv sync --all-extras

      - name: Install Studio dependencies
        run: cd studio && bun install --frozen-lockfile

      - name: Install Hub Backend dependencies
        run: cd hub/backend && uv sync --all-extras

      - name: Install Hub Frontend dependencies
        run: cd hub/frontend && bun install --frozen-lockfile

      - name: Run all tests
        run: python scripts/test.py --full --ci --server --studio --hub -p

      - name: Upload Server coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Studio coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-coverage
          path: studio/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Hub coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hub-coverage
          path: hub/backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  build-studio:
    name: Build Studio Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd studio && bun install --frozen-lockfile

      - name: Build web
        run: cd studio && bun run build:web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: studio/dist/**
          if-no-files-found: warn
          retention-days: 7

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun run build:cloudflare
        run: bun run build:cloudflare

