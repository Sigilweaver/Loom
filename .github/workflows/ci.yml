name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the heavy desktop jobs (Windows and macOS runners, installer
  # builds) are needed. They run when the desktop app, the server it bundles, or
  # the build tooling changed, on pull requests and on pushes to main. Linux
  # always runs the cheap Rust checks.
  changes:
    name: Detect desktop changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare against the base
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base=""
          # A push to a branch with an open PR also triggers the pull_request
          # run; build installers once, in the PR run. Pushes to main still
          # build them.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Push to a branch; the pull_request run covers the desktop jobs"
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit; running the desktop jobs"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -E \
            '^(studio/|server/|scripts/(build|smoke_desktop)\.py|\.github/scripts/|\.github/workflows/(ci|build-server|build-studio-tauri|release)\.yml)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  check-studio-tauri:
    name: Studio Tauri (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.desktop == 'true' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: studio/tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      # tauri-build needs the frontend output directory to exist.
      - name: Create frontend placeholder
        run: mkdir -p ../dist

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Tauri crate
        run: cargo check --locked

      - name: Lint Tauri crate
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features bundled-server -- -D warnings

      - name: Test Tauri crate
        run: cargo test --locked

  # Server binaries for the Full installers; only when the desktop app is built.
  build-server:
    name: Build Server
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/build-server.yml

  # Builds the Full installers on every desktop platform and launches each one
  # (scripts/smoke_desktop.py). The Client variant differs only by leaving the
  # sidecar out; releases build both.
  package-studio:
    name: Package Studio
    needs: [changes, build-server]
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/build-studio-tauri.yml
    permissions:
      contents: read
      actions: read
    with:
      variant: full

  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    # Hub backend tests need Postgres. conftest.py connects to
    # localhost:25801 and creates its own throwaway
    # sigilweaver_loom_hub_test database, so the credentials here must match
    # hub/docker-compose.yml (which maps the same 25801:5432 for local dev).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigilweaver_loom
          POSTGRES_PASSWORD: sigilweaver_loom
          POSTGRES_DB: sigilweaver_loom_hub
        ports:
          - 25801:5432
        options: >-
          --health-cmd "pg_isready -U sigilweaver_loom -d sigilweaver_loom_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            server/uv.lock
            hub/backend/uv.lock

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "server/.python-version"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Server dependencies
        run: cd server && uv sync --all-extras

      - name: Install Studio dependencies
        run: cd studio && bun install --frozen-lockfile

      - name: Install Hub Backend dependencies
        run: cd hub/backend && uv sync --all-extras

      - name: Install Hub Frontend dependencies
        run: cd hub/frontend && bun install --frozen-lockfile

      - name: Run all tests
        run: python scripts/test.py --full --ci --server --studio --hub --repo -p

      - name: Upload Server coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Studio coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-coverage
          path: studio/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Hub coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hub-coverage
          path: hub/backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  build-studio:
    name: Build Studio Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd studio && bun install --frozen-lockfile

      - name: Build web
        run: cd studio && bun run build:web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: studio/dist/**
          if-no-files-found: warn
          retention-days: 7

  # Builds (without pushing) the same Docker images docker-build.yml publishes on
  # release, so a broken Dockerfile fails here instead of on release day.
  docker-build-check:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [hub, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
