name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            server/uv.lock
            hub/backend/uv.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'server/.python-version'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            studio/package-lock.json
            hub/frontend/package-lock.json

      - name: Install Server dependencies
        run: cd server && uv sync --all-extras

      - name: Install Studio dependencies
        run: cd studio && npm ci

      - name: Install Hub Backend dependencies
        run: cd hub/backend && uv sync --all-extras

      - name: Install Hub Frontend dependencies
        run: cd hub/frontend && npm ci

      - name: Run all tests
        run: python scripts/test.py --full --ci --server --studio --hub -p

      - name: Upload Server coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Studio coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-coverage
          path: studio/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Hub coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-coverage
          path: hub/backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  build-studio:
    name: Build Studio Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: cd studio && npm ci

      - name: Build web
        run: cd studio && npm run build:web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: studio/dist/**
          if-no-files-found: warn
          retention-days: 7

