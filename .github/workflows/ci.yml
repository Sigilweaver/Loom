name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-studio-tauri:
    name: Check Studio Tauri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - name: Create frontend placeholder
        run: mkdir -p ../dist

      - name: Check Tauri crate
        run: cargo check --locked

      - name: Lint Tauri crate
        run: cargo clippy --locked -- -D warnings

  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    # Hub backend tests need Postgres. conftest.py connects to
    # localhost:25801 and creates its own throwaway
    # sigilweaver_loom_hub_test database, so the credentials here must match
    # hub/docker-compose.yml (which maps the same 25801:5432 for local dev).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigilweaver_loom
          POSTGRES_PASSWORD: sigilweaver_loom
          POSTGRES_DB: sigilweaver_loom_hub
        ports:
          - 25801:5432
        options: >-
          --health-cmd "pg_isready -U sigilweaver_loom -d sigilweaver_loom_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            server/uv.lock
            hub/backend/uv.lock

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "server/.python-version"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Server dependencies
        run: cd server && uv sync --all-extras

      - name: Install Studio dependencies
        run: cd studio && bun install --frozen-lockfile

      - name: Install Hub Backend dependencies
        run: cd hub/backend && uv sync --all-extras

      - name: Install Hub Frontend dependencies
        run: cd hub/frontend && bun install --frozen-lockfile

      - name: Run all tests
        run: python scripts/test.py --full --ci --server --studio --hub -p

      - name: Upload Server coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Studio coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-coverage
          path: studio/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Hub coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hub-coverage
          path: hub/backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  build-studio:
    name: Build Studio Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd studio && bun install --frozen-lockfile

      - name: Build web
        run: cd studio && bun run build:web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: studio/dist/**
          if-no-files-found: warn
          retention-days: 7
