name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/.vscode/**"
      - "**/.github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend - Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'backend/.python-version'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff (style-only; non-fatal)
        run: |
          # Run ruff but don't fail the job for non-critical/style-only issues
          # (E501, W29*, etc. will be reported but won't stop CI)
          uv run ruff check app/ tests/ --exit-zero
          echo "Ruff completed (style issues won't fail CI)."

      - name: Type check with mypy
        run: |
          uv run mypy app/ || echo "Mypy check completed with issues"

      - name: Run tests
        run: |
          uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  test-frontend:
    name: Frontend - Test, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint (non-fatal)
        run: npm run lint || true

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build web
        run: npm run build:web

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist/**
          if-no-files-found: warn
          retention-days: 7
