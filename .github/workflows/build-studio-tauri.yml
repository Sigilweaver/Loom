name: Build Studio

# Builds the Tauri desktop installers: Full (bundles the server as a sidecar)
# and Client (no server), on Linux, Windows and both macOS architectures.
# Full builds need the server artifacts from build-server.yml in the same run.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which variant to build"
        type: choice
        options: [both, full, client]
        default: both
      sign:
        description: "Sign the Windows and macOS builds (needs the windows-signing and macos-signing environments)"
        type: boolean
        default: false
      server-run-id:
        description: "Full builds: take the server artifacts from this Build Server run (a standalone run has none of its own)"
        type: string
        default: ""
  workflow_call:
    inputs:
      variant:
        type: string
        default: both
      sign:
        type: boolean
        default: false

# actions: read lets a standalone Full build download server artifacts from
# another run (server-run-id). Callers must grant it too.
permissions:
  contents: read
  actions: read

jobs:
  build-studio:
    name: Studio ${{ matrix.variant }} (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["full","client"]' || format('["{0}"]', inputs.variant)) }}
        label: [linux-x64, windows-x64, macos-arm64, macos-x64]
        include:
          - label: linux-x64
            os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            server-artifact: server-linux
          - label: windows-x64
            os: windows-latest
            platform: win
            target: x86_64-pc-windows-msvc
            server-artifact: server-win
          - label: macos-arm64
            os: macos-latest
            platform: mac
            target: aarch64-apple-darwin
            server-artifact: server-mac-arm64
          - label: macos-x64
            os: macos-15-intel
            platform: mac
            target: x86_64-apple-darwin
            server-artifact: server-mac-x64

    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.sign && (matrix.platform == 'win' && 'windows-signing' || matrix.platform == 'mac' && 'macos-signing') || '' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            xvfb \
            dbus

      - name: Install studio dependencies
        working-directory: studio
        run: bun install --frozen-lockfile

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/set-version.py

      - name: Download server artifact
        if: matrix.variant == 'full'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.server-artifact }}
          path: server/dist
          run-id: ${{ inputs.server-run-id || github.run_id }}
          github-token: ${{ inputs.server-run-id && github.token || '' }}

      - name: Make server executable
        if: matrix.variant == 'full' && matrix.platform != 'win'
        run: chmod +x server/dist/server

      # scripts/build.py stages the server as the sidecar and runs `tauri build`
      # (which builds the web assets first). It is the same command used locally.
      - name: Build Studio
        if: ${{ !inputs.sign || matrix.platform == 'linux' }}
        run: python scripts/build.py --studio-only ${{ matrix.variant == 'client' && '--client' || '' }}

      # Signed macOS builds: Tauri imports the Developer ID certificate into a
      # temporary keychain, signs the app and the server sidecar with the
      # hardened runtime and tauri/entitlements.plist, then notarizes and
      # staples the app with the App Store Connect API key.
      - name: Build Studio (signed macOS build)
        if: matrix.platform == 'mac' && inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          python scripts/build.py --studio-only ${{ matrix.variant == 'client' && '--client' || '' }}

      # Signed Windows builds: build.py signs the staged server sidecar and hands
      # scripts/sign-windows.ps1 to Tauri as its sign command, so Tauri signs
      # the app exe after its last patch, then the installer.
      # Tauri staples the notarization ticket right after notarizing, but the
      # ticket is not always fetchable yet, and a failed staple is not an error
      # there. Staple again with retries; if the dmg already holds the app
      # unstapled, rewrite the dmg with the stapled app.
      - name: Staple the notarization ticket (signed macOS build)
        if: matrix.platform == 'mac' && inputs.sign
        run: |
          bundle="studio/tauri/target/${{ matrix.target }}/release/bundle"
          app="$(ls -d "$bundle"/macos/*.app)"
          dmg="$(ls "$bundle"/dmg/*.dmg)"
          staple() {
            for i in 1 2 3 4 5 6; do
              xcrun stapler staple "$1" && return 0
              echo "staple attempt $i failed; retrying in 30s"; sleep 30
            done
            return 1
          }
          xcrun stapler validate "$app" || staple "$app"
          mnt="$RUNNER_TEMP/loom-dmg-check"
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          if xcrun stapler validate "$mnt"/*.app; then
            hdiutil detach "$mnt" -quiet; exit 0
          fi
          hdiutil detach "$mnt" -quiet
          echo "The app in $dmg is not stapled; rewriting the dmg"
          rw="$RUNNER_TEMP/loom-rw.dmg"
          hdiutil convert "$dmg" -format UDRW -o "$rw" -quiet
          hdiutil attach "$rw" -mountpoint "$mnt" -nobrowse -quiet
          staple "$mnt"/*.app
          hdiutil detach "$mnt" -quiet
          hdiutil convert "$rw" -format UDZO -imagekey zlib-level=9 -o "$dmg" -ov -quiet

      - name: Install the Artifact Signing module
        if: matrix.platform == 'win' && inputs.sign
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser

      - name: Build Studio (signed Windows build)
        if: matrix.platform == 'win' && inputs.sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: python scripts/build.py --studio-only --windows-sign ${{ matrix.variant == 'client' && '--client' || '' }}

      - name: Verify Windows signatures
        if: matrix.platform == 'win' && inputs.sign
        shell: pwsh
        # The app exe is checked after installation (Smoke test the installed
        # app): Tauri signs a patched copy for the installer and restores the
        # unsigned exe in target/ afterwards.
        run: |
          $release = "studio/tauri/target/${{ matrix.target }}/release"
          $files = @(Get-ChildItem "$release/bundle/nsis/*-setup.exe")
          if ("${{ matrix.variant }}" -eq "full") { $files += Get-Item "studio/tauri/binaries/loom-server-*.exe" }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) are not validly signed" }

      - name: Locate the built app
        id: app
        run: |
          exe="sigilweaver-loom-studio"
          if [ "${{ matrix.platform }}" = "win" ]; then exe="$exe.exe"; fi
          echo "path=studio/tauri/target/${{ matrix.target }}/release/$exe" >> "$GITHUB_OUTPUT"
          echo "bundles=studio/tauri/target/${{ matrix.target }}/release/bundle" >> "$GITHUB_OUTPUT"

      # The built binary, with the sidecar beside it. Checks: normal stop,
      # force-quit recovery, a second launch, and (Linux, Full) shutdown with a
      # request in flight.
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          dbus-run-session -- xvfb-run -a python scripts/smoke_desktop.py \
            --app "${{ steps.app.outputs.path }}" ${{ matrix.variant == 'client' && '--client' || '' }} \
            --check basic --check kill --check second-instance ${{ matrix.variant == 'full' && '--check slow-shutdown' || '' }}

      - name: Smoke test
        if: matrix.platform != 'linux'
        run: |
          python scripts/smoke_desktop.py \
            --app "${{ steps.app.outputs.path }}" ${{ matrix.variant == 'client' && '--client' || '' }} \
            --check basic --check kill --check second-instance

      # The installed layouts: where the sidecar actually ends up after
      # packaging (inside the AppImage, /usr/bin, Contents/MacOS, the NSIS dir).
      - name: Smoke test the AppImage (Linux)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimage="$(ls "${{ steps.app.outputs.bundles }}"/appimage/*.AppImage)"
          chmod +x "$appimage"
          dbus-run-session -- xvfb-run -a python scripts/smoke_desktop.py \
            --app "$appimage" ${{ matrix.variant == 'client' && '--client' || '' }} --check basic --check kill

      - name: Smoke test the deb in a clean container (Linux)
        if: matrix.platform == 'linux'
        run: |
          deb="$(ls "${{ steps.app.outputs.bundles }}"/deb/*.deb)"
          cp "$deb" /tmp/loom.deb
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            -v /tmp/loom.deb:/tmp/loom.deb:ro \
            -v "$PWD/scripts:/scripts:ro" \
            ubuntu:24.04 bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq /tmp/loom.deb python3 xvfb dbus >/dev/null
              ls -l /usr/bin/sigilweaver-loom-studio /usr/bin/loom-server || true
              dbus-run-session -- xvfb-run -a python3 /scripts/smoke_desktop.py \
                --app /usr/bin/sigilweaver-loom-studio ${{ matrix.variant == 'client' && '--client' || '' }} --check basic --check kill
            '

      - name: Smoke test the installed app (macOS)
        if: matrix.platform == 'mac'
        run: |
          dmg="$(ls "${{ steps.app.outputs.bundles }}"/dmg/*.dmg)"
          hdiutil attach "$dmg" -mountpoint /tmp/loom-dmg -nobrowse -quiet
          trap 'hdiutil detach /tmp/loom-dmg -quiet || true' EXIT
          app="$(ls -d /tmp/loom-dmg/*.app)"
          ls -l "$app/Contents/MacOS"
          if [ "${{ inputs.sign }}" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            for bin in "$app"/Contents/MacOS/*; do
              codesign -d --verbose=2 "$bin" 2>&1 | grep -E '^(Executable|Authority=Developer ID Application|TeamIdentifier|Runtime Version)'
              codesign -d --verbose=2 "$bin" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::$bin lacks the hardened runtime"; exit 1; }
            done
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
          python scripts/smoke_desktop.py \
            --app "$app/Contents/MacOS/sigilweaver-loom-studio" ${{ matrix.variant == 'client' && '--client' || '' }} \
            --check basic --check kill

      - name: Smoke test the installed app (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "${{ steps.app.outputs.bundles }}/nsis/*-setup.exe").FullName
          $dir = "C:\loom-install"
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait
          Get-ChildItem $dir
          if ("${{ inputs.sign }}" -eq "true") {
            $bad = 0
            foreach ($f in Get-ChildItem "$dir/*.exe" -Exclude uninstall.exe) {
              $sig = Get-AuthenticodeSignature $f.FullName
              Write-Host "installed $($f.Name): $($sig.Status)"
              if ($sig.Status -ne 'Valid') { $bad++ }
            }
            if ($bad -gt 0) { throw "$bad installed file(s) are not validly signed" }
          }
          $client = if ("${{ matrix.variant }}" -eq "client") { "--client" } else { $null }
          python scripts/smoke_desktop.py --app "$dir\sigilweaver-loom-studio.exe" $client --check basic --check kill
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
          # The uninstaller copies itself and returns at once; wait for the files to go.
          Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\sigilweaver-loom-studio.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\sigilweaver-loom-studio.exe") { throw "uninstall left the app behind" }
          Write-Host "OK: installed, launched and uninstalled"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: studio-${{ matrix.variant }}-${{ matrix.label }}
          path: |
            studio/tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            studio/tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            studio/tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            studio/tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            studio/tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
