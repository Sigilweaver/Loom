name: Build Studio Tauri

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            artifact-name: linux-tauri-artifacts
          - os: windows-latest
            platform: win
            target: x86_64-pc-windows-msvc
            artifact-name: windows-tauri-artifacts
          - os: macos-latest
            platform: mac-arm
            target: aarch64-apple-darwin
            artifact-name: macos-arm-tauri-artifacts

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/tauri -> target
          cache-on-failure: true

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install studio dependencies
        run: bun install --frozen-lockfile

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: python3 .github/scripts/set-version.py

      - name: Build web assets
        run: bun run build:web

      - name: Build Tauri app
        run: bun x tauri build --target ${{ matrix.target }}

      # Collect artifacts based on platform
      - name: Collect Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          mkdir -p tauri-dist
          cp tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb tauri-dist/ || true
          cp tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm tauri-dist/ || true
          cp tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage tauri-dist/ || true
          ls -la tauri-dist/

      - name: Collect Windows artifacts
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tauri-dist
          Copy-Item tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi tauri-dist/ -ErrorAction SilentlyContinue
          Copy-Item tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe tauri-dist/ -ErrorAction SilentlyContinue
          Get-ChildItem tauri-dist/

      - name: Collect macOS artifacts
        if: startsWith(matrix.platform, 'mac')
        run: |
          mkdir -p tauri-dist
          cp tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg tauri-dist/ || true
          cp tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz tauri-dist/ || true
          ls -la tauri-dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: studio/tauri-dist/*
          if-no-files-found: warn
