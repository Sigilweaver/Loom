name: Build Studio

# Builds the Tauri desktop installers: Full (bundles the server as a sidecar)
# and Client (no server), on Linux, Windows and both macOS architectures.
# Full builds need the server artifacts from build-server.yml in the same run.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which variant to build"
        type: choice
        options: [both, full, client]
        default: both
      sign:
        description: "Sign the Windows installers (needs the windows-signing environment)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      variant:
        type: string
        default: both
      sign:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-studio:
    name: Studio ${{ matrix.variant }} (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["full","client"]' || format('["{0}"]', inputs.variant)) }}
        label: [linux-x64, windows-x64, macos-arm64, macos-x64]
        include:
          - label: linux-x64
            os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            server-artifact: server-linux
          - label: windows-x64
            os: windows-latest
            platform: win
            target: x86_64-pc-windows-msvc
            server-artifact: server-win
          - label: macos-arm64
            os: macos-latest
            platform: mac
            target: aarch64-apple-darwin
            server-artifact: server-mac-arm64
          - label: macos-x64
            os: macos-15-intel
            platform: mac
            target: x86_64-apple-darwin
            server-artifact: server-mac-x64

    runs-on: ${{ matrix.os }}
    environment: ${{ (matrix.platform == 'win' && inputs.sign) && 'windows-signing' || '' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            xvfb \
            dbus

      - name: Install studio dependencies
        working-directory: studio
        run: bun install --frozen-lockfile

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/set-version.py

      - name: Download server artifact
        if: matrix.variant == 'full'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.server-artifact }}
          path: server/dist

      - name: Make server executable
        if: matrix.variant == 'full' && matrix.platform != 'win'
        run: chmod +x server/dist/server

      # scripts/build.py stages the server as the sidecar and runs `tauri build`
      # (which builds the web assets first). It is the same command used locally.
      - name: Build Studio
        if: ${{ !(matrix.platform == 'win' && inputs.sign) }}
        run: python scripts/build.py --studio-only ${{ matrix.variant == 'client' && '--client' || '' }}

      # Signed Windows builds: compile, sign the executables, package, then sign
      # the installer, so the exes inside the installer are signed as well.
      - name: Compile Studio (signed Windows build)
        if: matrix.platform == 'win' && inputs.sign
        run: python scripts/build.py --studio-only --no-bundle ${{ matrix.variant == 'client' && '--client' || '' }}

      - name: Sign the app executable
        if: matrix.platform == 'win' && inputs.sign
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: studio/tauri/target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the bundled server
        if: matrix.platform == 'win' && inputs.sign && matrix.variant == 'full'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: studio/tauri/binaries
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package Studio (signed Windows build)
        if: matrix.platform == 'win' && inputs.sign
        run: python scripts/build.py --studio-only --bundle-only ${{ matrix.variant == 'client' && '--client' || '' }}

      - name: Sign Windows installer
        if: matrix.platform == 'win' && inputs.sign
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: studio/tauri/target/${{ matrix.target }}/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows signatures
        if: matrix.platform == 'win' && inputs.sign
        shell: pwsh
        run: |
          $release = "studio/tauri/target/${{ matrix.target }}/release"
          $files = @(Get-ChildItem "$release/bundle/nsis/*-setup.exe") + @(Get-Item "$release/sigilweaver-loom-studio.exe")
          if ("${{ matrix.variant }}" -eq "full") { $files += Get-Item "studio/tauri/binaries/loom-server-*.exe" }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) are not validly signed" }

      - name: Locate the built app
        id: app
        run: |
          exe="sigilweaver-loom-studio"
          if [ "${{ matrix.platform }}" = "win" ]; then exe="$exe.exe"; fi
          echo "path=studio/tauri/target/${{ matrix.target }}/release/$exe" >> "$GITHUB_OUTPUT"
          echo "bundles=studio/tauri/target/${{ matrix.target }}/release/bundle" >> "$GITHUB_OUTPUT"

      # The built binary, with the sidecar beside it. Checks: normal stop,
      # force-quit recovery, a second launch, and (Linux, Full) shutdown with a
      # request in flight.
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          dbus-run-session -- xvfb-run -a python scripts/smoke_desktop.py \
            --app "${{ steps.app.outputs.path }}" ${{ matrix.variant == 'client' && '--client' || '' }} \
            --check basic --check kill --check second-instance ${{ matrix.variant == 'full' && '--check slow-shutdown' || '' }}

      - name: Smoke test
        if: matrix.platform != 'linux'
        run: |
          python scripts/smoke_desktop.py \
            --app "${{ steps.app.outputs.path }}" ${{ matrix.variant == 'client' && '--client' || '' }} \
            --check basic --check kill --check second-instance

      # The installed layouts: where the sidecar actually ends up after
      # packaging (inside the AppImage, /usr/bin, Contents/MacOS, the NSIS dir).
      - name: Smoke test the AppImage (Linux)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimage="$(ls "${{ steps.app.outputs.bundles }}"/appimage/*.AppImage)"
          chmod +x "$appimage"
          dbus-run-session -- xvfb-run -a python scripts/smoke_desktop.py \
            --app "$appimage" ${{ matrix.variant == 'client' && '--client' || '' }} --check basic --check kill

      - name: Smoke test the deb in a clean container (Linux)
        if: matrix.platform == 'linux'
        run: |
          deb="$(ls "${{ steps.app.outputs.bundles }}"/deb/*.deb)"
          cp "$deb" /tmp/loom.deb
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            -v /tmp/loom.deb:/tmp/loom.deb:ro \
            -v "$PWD/scripts:/scripts:ro" \
            ubuntu:24.04 bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq /tmp/loom.deb python3 xvfb dbus >/dev/null
              ls -l /usr/bin/sigilweaver-loom-studio /usr/bin/loom-server || true
              dbus-run-session -- xvfb-run -a python3 /scripts/smoke_desktop.py \
                --app /usr/bin/sigilweaver-loom-studio ${{ matrix.variant == 'client' && '--client' || '' }} --check basic --check kill
            '

      - name: Smoke test the installed app (macOS)
        if: matrix.platform == 'mac'
        run: |
          dmg="$(ls "${{ steps.app.outputs.bundles }}"/dmg/*.dmg)"
          hdiutil attach "$dmg" -mountpoint /tmp/loom-dmg -nobrowse -quiet
          trap 'hdiutil detach /tmp/loom-dmg -quiet || true' EXIT
          app="$(ls -d /tmp/loom-dmg/*.app)"
          ls -l "$app/Contents/MacOS"
          python scripts/smoke_desktop.py \
            --app "$app/Contents/MacOS/sigilweaver-loom-studio" ${{ matrix.variant == 'client' && '--client' || '' }} \
            --check basic --check kill

      - name: Smoke test the installed app (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "${{ steps.app.outputs.bundles }}/nsis/*-setup.exe").FullName
          $dir = "C:\loom-install"
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait
          Get-ChildItem $dir
          if ("${{ inputs.sign }}" -eq "true") {
            $bad = 0
            foreach ($f in Get-ChildItem "$dir/*.exe" -Exclude uninstall.exe) {
              $sig = Get-AuthenticodeSignature $f.FullName
              Write-Host "installed $($f.Name): $($sig.Status)"
              if ($sig.Status -ne 'Valid') { $bad++ }
            }
            if ($bad -gt 0) { throw "$bad installed file(s) are not validly signed" }
          }
          $client = if ("${{ matrix.variant }}" -eq "client") { "--client" } else { $null }
          python scripts/smoke_desktop.py --app "$dir\sigilweaver-loom-studio.exe" $client --check basic --check kill
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
          # The uninstaller copies itself and returns at once; wait for the files to go.
          Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\sigilweaver-loom-studio.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\sigilweaver-loom-studio.exe") { throw "uninstall left the app behind" }
          Write-Host "OK: installed, launched and uninstalled"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: studio-${{ matrix.variant }}-${{ matrix.label }}
          path: |
            studio/tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            studio/tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            studio/tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            studio/tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            studio/tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
