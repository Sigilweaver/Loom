name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-tag-on-main:
    name: Validate tag points to main
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Fetch main
        run: git fetch origin main --prune
      
      - name: Check tag commit is on main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "${ref}" != refs/tags/* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git rev-list -n 1 "${ref}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag commit is contained in origin/main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on origin/main; skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-backend.yml
    with:
      python-version: '3.11'

  build-frontend-full:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: [validate-tag-on-main, build-backend]
    uses: ./.github/workflows/build-frontend-full.yml
    with:
      node-version: '22'

  build-frontend-client:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-frontend-client.yml
    with:
      node-version: '22'

  build-web:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-web.yml
    with:
      node-version: '22'

  publish-assets:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag-on-main
      - build-backend
      - build-frontend-full
      - build-frontend-client
      - build-web
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets with naming
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          
          VERSION="${GITHUB_REF_NAME}"
          
          # Linux Full
          find artifacts/linux-full-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-full-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-${VERSION}-x64.snap \; || true
          
          # Linux Client
          find artifacts/linux-client-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-Client-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-client-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-Client-${VERSION}-x64.snap \; || true
          
          # Windows Full
          find artifacts/windows-full-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Setup-${VERSION}.exe \; || true
          find artifacts/windows-full-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Portable-${VERSION}.exe \; || true
          
          # Windows Client
          find artifacts/windows-client-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Client-Setup-${VERSION}.exe \; || true
          find artifacts/windows-client-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Client-Portable-${VERSION}.exe \; || true
          
          # macOS builds currently disabled (cost optimization)
          # Uncomment when macOS builds are re-enabled: (also in build workflows)
          # macOS Full
          # find artifacts/macos-full-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-${VERSION}.dmg \; || true
          
          # macOS Client
          # find artifacts/macos-client-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-Client-${VERSION}.dmg \; || true
          
          # Web
          cp artifacts/web-dist-zip/dist-web.zip release-assets/Sigilweaver-Web-${VERSION}.zip || true
          
          echo "Prepared release assets:"
          ls -lh release-assets/ || true

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          if compgen -G "release-assets/*" > /dev/null; then
            (cd release-assets && sha256sum * > SHA256SUMS.txt)
            echo "Generated SHA256SUMS.txt"
          fi

      - name: Generate downloads.json manifest
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
        shell: bash
        run: |
          export NOW_ISO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 .github/scripts/generate-downloads-manifest.py

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          
          VERSION="${GITHUB_REF_NAME}"
          
          # Check expected files exist
          expected=(
            "Sigilweaver-${VERSION}-x64.AppImage"
            "Sigilweaver-${VERSION}-x64.snap"
            "Sigilweaver-Setup-${VERSION}.exe"
            "Sigilweaver-Portable-${VERSION}.exe"
            # macOS builds disabled for cost optimization
            # "Sigilweaver-${VERSION}.dmg"
            "Sigilweaver-Client-${VERSION}-x64.AppImage"
            "Sigilweaver-Client-${VERSION}-x64.snap"
            "Sigilweaver-Client-Setup-${VERSION}.exe"
            "Sigilweaver-Client-Portable-${VERSION}.exe"
            # "Sigilweaver-Client-${VERSION}.dmg"
            "Sigilweaver-Web-${VERSION}.zip"
            "SHA256SUMS.txt"
          )
          
          echo "Validating release assets..."
          for asset in "${expected[@]}"; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "WARNING: Missing asset: $asset"
              missing=1
            else
              echo "OK: Found $asset"
            fi
          done
          
          if [ $missing -eq 1 ]; then
            echo ""
            echo "WARNING: Some expected assets are missing."
            echo "This may be expected (e.g., snap builds can be flaky)."
            echo ""
            echo "Available files:"
            ls -lh release-assets/
            echo ""
            echo "Continuing with available assets..."
          else
            echo ""
            echo "SUCCESS: All expected assets present!"
          fi

      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Mirror assets and manifests to Backblaze B2 (S3 API)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 .github/scripts/upload_to_b2.py \
            "${{ github.ref_name }}" \
            release-assets/

      - name: Summary of uploaded assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## B2 Upload Summary" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "release-assets/*" > /dev/null; then
            echo "Uploaded the following to https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/:" >> "$GITHUB_STEP_SUMMARY"
            for f in release-assets/*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              echo "- https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/${base}" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Downloads manifest:** https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/downloads.json" >> "$GITHUB_STEP_SUMMARY"
            echo "Stable manifest: https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/stable/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-assets present." >> "$GITHUB_STEP_SUMMARY"
          fi
