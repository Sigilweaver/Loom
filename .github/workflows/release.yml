name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping release builds for the same tag. Two pushes of the
# same tag (e.g. a force-push) would otherwise race to produce release
# assets and could publish inconsistent artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag-on-main:
    name: Validate tag points to main
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Fetch main
        run: git fetch origin main --prune
      
      - name: Check tag commit is on main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "${ref}" != refs/tags/* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git rev-list -n 1 "${ref}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag commit is contained in origin/main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on origin/main; skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-server:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-server.yml
    secrets: inherit
    with:
      python-version: '3.13'

  build-studio-full:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: [validate-tag-on-main, build-server]
    uses: ./.github/workflows/build-studio-full.yml
    secrets: inherit

  build-studio-client:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-studio-client.yml
    secrets: inherit

  build-web:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  publish-assets:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag-on-main
      - build-server
      - build-studio-full
      - build-studio-client
      - build-web
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets with naming
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          
          VERSION="${GITHUB_REF_NAME}"
          
          # Linux Full
          find artifacts/linux-full-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-Loom-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-full-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-Loom-${VERSION}-x64.snap \; || true
          
          # Linux Client
          find artifacts/linux-client-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-Loom-Client-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-client-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-Loom-Client-${VERSION}-x64.snap \; || true
          
          # Windows Full
          find artifacts/windows-full-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Setup-${VERSION}.exe \; || true
          find artifacts/windows-full-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Portable-${VERSION}.exe \; || true
          
          # Windows Client
          find artifacts/windows-client-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Client-Setup-${VERSION}.exe \; || true
          find artifacts/windows-client-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Client-Portable-${VERSION}.exe \; || true
          
          # macOS Full
          find artifacts/macos-full-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-Loom-${VERSION}.dmg \; || true
          
          # macOS Client
          find artifacts/macos-client-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-Loom-Client-${VERSION}.dmg \; || true
          
          # Web
          cp artifacts/web-dist-zip/dist-web.zip release-assets/Sigilweaver-Loom-Web-${VERSION}.zip || true
          
          echo "Prepared release assets:"
          ls -lh release-assets/ || true

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          if compgen -G "release-assets/*" > /dev/null; then
            python3 .github/scripts/generate-checksums.py release-assets/
          fi

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          
          VERSION="${GITHUB_REF_NAME}"
          
          # Check expected files exist
          expected=(
            "Sigilweaver-Loom-${VERSION}-x64.AppImage"
            "Sigilweaver-Loom-${VERSION}-x64.snap"
            "Sigilweaver-Loom-Setup-${VERSION}.exe"
            "Sigilweaver-Loom-Portable-${VERSION}.exe"
            "Sigilweaver-Loom-${VERSION}.dmg"
            "Sigilweaver-Loom-Client-${VERSION}-x64.AppImage"
            "Sigilweaver-Loom-Client-${VERSION}-x64.snap"
            "Sigilweaver-Loom-Client-Setup-${VERSION}.exe"
            "Sigilweaver-Loom-Client-Portable-${VERSION}.exe"
            "Sigilweaver-Loom-Client-${VERSION}.dmg"
            "Sigilweaver-Loom-Web-${VERSION}.zip"
            "SHA256SUMS.txt"
          )
          
          echo "Validating release assets..."
          for asset in "${expected[@]}"; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "WARNING: Missing asset: $asset"
              missing=1
            else
              echo "OK: Found $asset"
            fi
          done
          
          if [ $missing -eq 1 ]; then
            echo ""
            echo "WARNING: Some expected assets are missing."
            echo "This may be expected (e.g., snap builds can be flaky)."
            echo ""
            echo "Available files:"
            ls -lh release-assets/
            echo ""
            echo "Continuing with available assets..."
          else
            echo ""
            echo "SUCCESS: All expected assets present!"
          fi

      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Mirror assets and manifests to Cloudflare R2 (S3 API)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_CDN_URL: ${{ secrets.R2_CDN_URL }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 .github/scripts/upload_to_r2.py \
            "${{ github.ref_name }}" \
            release-assets/

      - name: Summary of uploaded assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          R2_CDN_URL: ${{ secrets.R2_CDN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          CDN="${R2_CDN_URL:-https://download.sigilweaver.app}"
          echo "## R2 Upload Summary" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "release-assets/*" > /dev/null; then
            echo "Uploaded the following to ${CDN}/releases/loom/${VERSION}/:" >> "$GITHUB_STEP_SUMMARY"
            for f in release-assets/*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              echo "- ${CDN}/releases/loom/${VERSION}/${base}" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Downloads manifest:** ${CDN}/releases/loom/${VERSION}/downloads.json" >> "$GITHUB_STEP_SUMMARY"
            echo "**Stable manifest:** ${CDN}/releases/loom/${VERSION}/manifest.json" >> "$GITHUB_STEP_SUMMARY"
            echo "**Releases index:** ${CDN}/releases/loom/index.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-assets present." >> "$GITHUB_STEP_SUMMARY"
          fi
