# Build Release
#
# Pushing a v* tag builds every installer and creates a DRAFT GitHub release.
# Nothing is public until a maintainer reviews the draft and publishes it:
#
#   - Tags with a '-' suffix (v1.0.0-rc.1) are marked as pre-releases.
#   - Publishing the draft triggers mirror-release.yml (Cloudflare R2 mirror and
#     download manifests) and docker-build.yml (ghcr.io images). Both skip the
#     "latest" pointers for pre-releases.
#   - The tag must be a semver tag on main whose commit has a passing CI run.

name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping release builds for the same tag. Two pushes of the
# same tag (e.g. a force-push) would otherwise race to produce release
# assets and could publish inconsistent artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag-on-main:
    name: Validate tag
    runs-on: ubuntu-latest
    # actions: read lets the CI gate query workflow runs for the tagged commit.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main --prune

      - name: Check tag format and that the commit is on main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "${ref}" != refs/tags/* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "${tag}" =~ ${semver} ]]; then
            echo "::error::Tag '${tag}' is not a semver release tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease)."
            exit 1
          fi

          # A '-' suffix marks a pre-release (v1.0.0-rc.1).
          if [[ "${tag}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          commit=$(git rev-list -n 1 "${ref}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag commit is contained in origin/main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on origin/main; skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a passing CI run for the tagged commit
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-list -n 1 "${GITHUB_REF}")
          python3 .github/scripts/check_ci_status.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${commit}"

  build-server:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-server.yml
    secrets: inherit

  build-studio-full:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: [validate-tag-on-main, build-server]
    uses: ./.github/workflows/build-studio-full.yml
    secrets: inherit

  build-studio-client:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-studio-client.yml
    secrets: inherit

  build-web:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  publish-assets:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag-on-main
      - build-server
      - build-studio-full
      - build-studio-client
      - build-web
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets with naming
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          
          VERSION="${GITHUB_REF_NAME}"
          
          # Linux Full
          find artifacts/linux-full-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-Loom-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-full-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-Loom-${VERSION}-x64.snap \; || true
          
          # Linux Client
          find artifacts/linux-client-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-Loom-Client-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-client-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-Loom-Client-${VERSION}-x64.snap \; || true
          
          # Windows Full
          find artifacts/windows-full-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Setup-${VERSION}.exe \; || true
          find artifacts/windows-full-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Portable-${VERSION}.exe \; || true
          
          # Windows Client
          find artifacts/windows-client-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Client-Setup-${VERSION}.exe \; || true
          find artifacts/windows-client-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Loom-Client-Portable-${VERSION}.exe \; || true
          
          # macOS Full
          find artifacts/macos-full-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-Loom-${VERSION}.dmg \; || true
          
          # macOS Client
          find artifacts/macos-client-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-Loom-Client-${VERSION}.dmg \; || true
          
          # Web
          cp artifacts/web-dist-zip/dist-web.zip release-assets/Sigilweaver-Loom-Web-${VERSION}.zip || true
          
          echo "Prepared release assets:"
          ls -lh release-assets/ || true

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          if compgen -G "release-assets/*" > /dev/null; then
            python3 .github/scripts/generate-checksums.py release-assets/
          fi

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          VERSION="${GITHUB_REF_NAME}"

          # Check expected files exist
          expected=(
            "Sigilweaver-Loom-${VERSION}-x64.AppImage"
            "Sigilweaver-Loom-${VERSION}-x64.snap"
            "Sigilweaver-Loom-Setup-${VERSION}.exe"
            "Sigilweaver-Loom-Portable-${VERSION}.exe"
            "Sigilweaver-Loom-${VERSION}.dmg"
            "Sigilweaver-Loom-Client-${VERSION}-x64.AppImage"
            "Sigilweaver-Loom-Client-${VERSION}-x64.snap"
            "Sigilweaver-Loom-Client-Setup-${VERSION}.exe"
            "Sigilweaver-Loom-Client-Portable-${VERSION}.exe"
            "Sigilweaver-Loom-Client-${VERSION}.dmg"
            "Sigilweaver-Loom-Web-${VERSION}.zip"
            "SHA256SUMS.txt"
          )

          echo "Validating release assets..."
          for asset in "${expected[@]}"; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "::warning::Missing asset: $asset"
              missing+=("$asset")
            else
              echo "OK: Found $asset"
            fi
          done

          {
            echo "## Release assets"
            if [ ${#missing[@]} -eq 0 ]; then
              echo "All expected assets are present."
            else
              echo "**Missing expected assets** (snap builds can be flaky; review before publishing):"
              for asset in "${missing[@]}"; do
                echo "- ${asset}"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#missing[@]} -gt 0 ]; then
            echo ""
            echo "Available files:"
            ls -lh release-assets/
            echo "Continuing: the release is a draft, so a maintainer reviews the assets before publishing."
          else
            echo "SUCCESS: All expected assets present!"
          fi

      # The release is created as a DRAFT so a maintainer can review the assets
      # and notes before anything is public. Publishing the draft (in the GitHub
      # UI) is what triggers the R2 mirror (mirror-release.yml) and the Docker
      # images (docker-build.yml). Tags with a '-' suffix are pre-releases.
      - name: Create draft GitHub Release
        id: release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.validate-tag-on-main.outputs.prerelease == 'true' }}

      - name: Summarize draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          PRERELEASE: ${{ needs.validate-tag-on-main.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Draft release created"
            echo ""
            echo "Review the assets and notes, then publish: ${RELEASE_URL}"
            echo ""
            if [ "${PRERELEASE}" = "true" ]; then
              echo "This tag is a **pre-release**. Publishing it mirrors the assets to R2 under"
              echo "its versioned path only and does not touch the stable index or the"
              echo "\`latest\` Docker tag."
            else
              echo "Publishing this release mirrors it to R2, updates the stable index and"
              echo "pushes the Docker images including the \`latest\` tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
