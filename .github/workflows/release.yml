name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-tag-on-main:
    name: Validate tag points to main
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Fetch main
        run: git fetch origin main --prune
      
      - name: Check tag commit is on main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "${ref}" != refs/tags/* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git rev-list -n 1 "${ref}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag commit is contained in origin/main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on origin/main; skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-backend.yml
    with:
      python-version: '3.11'

  build-frontend-full:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: [validate-tag-on-main, build-backend]
    uses: ./.github/workflows/build-frontend-full.yml
    with:
      node-version: '22'

  build-frontend-client:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-frontend-client.yml
    with:
      node-version: '22'

  build-web:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-web.yml
    with:
      node-version: '22'

  publish-assets:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag-on-main
      - build-backend
      - build-frontend-full
      - build-frontend-client
      - build-web
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets with naming
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          
          VERSION="${GITHUB_REF_NAME}"
          
          # Linux Full
          find artifacts/linux-full-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-full-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-${VERSION}-x64.snap \; || true
          
          # Linux Client
          find artifacts/linux-client-artifacts -name "*.AppImage" -exec cp {} release-assets/Sigilweaver-Client-${VERSION}-x64.AppImage \; || true
          find artifacts/linux-client-artifacts -name "*.snap" -exec cp {} release-assets/Sigilweaver-Client-${VERSION}-x64.snap \; || true
          
          # Windows Full
          find artifacts/windows-full-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Setup-${VERSION}.exe \; || true
          find artifacts/windows-full-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Portable-${VERSION}.exe \; || true
          
          # Windows Client
          find artifacts/windows-client-artifacts -name "*Setup*.exe" -exec cp {} release-assets/Sigilweaver-Client-Setup-${VERSION}.exe \; || true
          find artifacts/windows-client-artifacts -name "*Portable*.exe" -exec cp {} release-assets/Sigilweaver-Client-Portable-${VERSION}.exe \; || true
          
          # macOS builds currently disabled (cost optimization)
          # Uncomment when macOS builds are re-enabled: (also in build workflows)
          # macOS Full
          # find artifacts/macos-full-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-${VERSION}.dmg \; || true
          
          # macOS Client
          # find artifacts/macos-client-artifacts -name "*.dmg" -exec cp {} release-assets/Sigilweaver-Client-${VERSION}.dmg \; || true
          
          # Web
          cp artifacts/web-dist-zip/dist-web.zip release-assets/Sigilweaver-Web-${VERSION}.zip || true
          
          echo "Prepared release assets:"
          ls -lh release-assets/ || true

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          if compgen -G "release-assets/*" > /dev/null; then
            (cd release-assets && sha256sum * > SHA256SUMS.txt)
            echo "Generated SHA256SUMS.txt"
          fi

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          
          VERSION="${GITHUB_REF_NAME}"
          
          # Check expected files exist
          expected=(
            "Sigilweaver-${VERSION}-x64.AppImage"
            "Sigilweaver-${VERSION}-x64.snap"
            "Sigilweaver-Setup-${VERSION}.exe"
            "Sigilweaver-Portable-${VERSION}.exe"
            # macOS builds disabled for cost optimization
            # "Sigilweaver-${VERSION}.dmg"
            "Sigilweaver-Client-${VERSION}-x64.AppImage"
            "Sigilweaver-Client-${VERSION}-x64.snap"
            "Sigilweaver-Client-Setup-${VERSION}.exe"
            "Sigilweaver-Client-Portable-${VERSION}.exe"
            # "Sigilweaver-Client-${VERSION}.dmg"
            "Sigilweaver-Web-${VERSION}.zip"
            "SHA256SUMS.txt"
          )
          
          echo "Validating release assets..."
          for asset in "${expected[@]}"; do
            if [ ! -f "release-assets/$asset" ]; then
              echo "WARNING: Missing asset: $asset"
              missing=1
            else
              echo "OK: Found $asset"
            fi
          done
          
          if [ $missing -eq 1 ]; then
            echo ""
            echo "WARNING: Some expected assets are missing."
            echo "This may be expected (e.g., snap builds can be flaky)."
            echo ""
            echo "Available files:"
            ls -lh release-assets/
            echo ""
            echo "Continuing with available assets..."
          else
            echo ""
            echo "SUCCESS: All expected assets present!"
          fi

      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Install AWS CLI for B2 S3 API
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if ! command -v aws &> /dev/null; then
            echo "Installing AWS CLI..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          else
            echo "AWS CLI already installed"
          fi
          aws --version
          
          # Ensure jq is available for manifest processing
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update -qq && sudo apt-get install -y jq
          fi
          jq --version

      - name: Mirror assets and manifests to Backblaze B2 (S3 API)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_DEFAULT_REGION: us-east-1
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${B2_APPLICATION_KEY_ID:-}" ] || [ -z "${B2_APPLICATION_KEY:-}" ] || [ -z "${B2_BUCKET_NAME:-}" ] || [ -z "${B2_ENDPOINT_URL:-}" ]; then
            echo "B2 secrets missing; skipping upload."
            exit 0
          fi
          
          # Extract region from B2 endpoint URL (e.g., s3.us-east-005.backblazeb2.com -> us-east-005)
          B2_REGION=$(echo "$B2_ENDPOINT_URL" | sed -n 's/^s3\.\([^.]*\)\.backblazeb2\.com$/\1/p')
          if [ -z "$B2_REGION" ]; then
            echo "WARNING: Could not extract region from endpoint, using default"
            B2_REGION="${B2_DEFAULT_REGION:-us-east-1}"
          fi
          echo "Using B2 region: $B2_REGION"
          
          export AWS_ACCESS_KEY_ID="${B2_APPLICATION_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${B2_APPLICATION_KEY}"
          export AWS_DEFAULT_REGION="$B2_REGION"
          
          # Configure AWS CLI for B2 S3-compatible API
          aws configure set s3.signature_version s3v4
          aws configure set s3.addressing_style path
          
          now_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version_label="${GITHUB_REF_NAME}"
          dest_prefix="latest"
          asset_cache_control="max-age=300,public"
          for f in release-assets/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            echo "Uploading $base to $dest_prefix via S3 API"
            aws s3 cp "$f" "s3://$B2_BUCKET_NAME/$dest_prefix/$base" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$asset_cache_control"
          done
          if [ -f release-assets/SHA256SUMS.txt ]; then
            aws s3 cp release-assets/SHA256SUMS.txt "s3://$B2_BUCKET_NAME/$dest_prefix/SHA256SUMS.txt" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$asset_cache_control"
          fi
          assets_json="["
          first=1
          for f in release-assets/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            # Skip checksums file and manifest directory from asset list
            [[ "$base" == "SHA256SUMS.txt" ]] && continue
            [[ "$base" == "manifests" ]] && continue
            ext="${base##*.}"
            os="unknown"; id="$ext"; kind="file"
            case "$ext" in
              exe) os="windows"; id="windowsInstaller"; kind="installer" ;;
              dmg) os="macos"; id="macDmg"; kind="image" ;;
              AppImage|Appimage|appimage) os="linux"; id="linuxAppImage"; kind="image" ;;
              snap) os="linux"; id="linuxSnap"; kind="image" ;;
              zip) os="web"; id="webZip"; kind="archive" ;;
            esac
            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
            sha=$(sha256sum "$f" 2>/dev/null | awk '{print $1}')
            url="https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/$dest_prefix/${base}"
            item="{\"id\":\"$id\",\"os\":\"$os\",\"arch\":\"any\",\"kind\":\"$kind\",\"fileName\":\"$base\",\"url\":\"$url\",\"size\":$size,\"sha256\":\"$sha\"}"
            if [ $first -eq 1 ]; then assets_json="$assets_json$item"; first=0; else assets_json="$assets_json,$item"; fi
          done
          assets_json="$assets_json]"
          mkdir -p release-assets/manifests
          printf '{"schemaVersion":1,"channel":"stable","version":"%s","date":"%s","commit":"%s","assets":%s}' \
            "$version_label" "$now_iso" "$GITHUB_SHA" "$assets_json" \
            > release-assets/manifests/manifest.stable.json
          manifest_cache_control="max-age=60,public"
          versioned_manifest_cache_control="max-age=31536000,public,immutable"
          aws s3 cp release-assets/manifests/manifest.stable.json "s3://$B2_BUCKET_NAME/latest/stable/.staging/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$manifest_cache_control"
          aws s3 cp "s3://$B2_BUCKET_NAME/latest/stable/.staging/manifest.json" "s3://$B2_BUCKET_NAME/latest/stable/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$manifest_cache_control"
          aws s3 cp release-assets/manifests/manifest.stable.json "s3://$B2_BUCKET_NAME/releases/${version_label}/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$versioned_manifest_cache_control"
          if command -v jq >/dev/null 2>&1 && aws s3 cp "s3://$B2_BUCKET_NAME/releases/index.json" /tmp/rindex.json --endpoint-url "https://$B2_ENDPOINT_URL" 2>/dev/null; then
            jq --arg v "$version_label" --arg d "$now_iso" --arg u "https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/releases/${version_label}/manifest.json" \
               '(.schemaVersion=1) | (.generatedAt=now|toiso8601) | (.latest=$v) | (.releases=((.releases // []) | map(select(.version!=$v)) + [{version:$v,date:$d,manifestUrl:$u}]))' \
               /tmp/rindex.json > /tmp/rindex.new.json || true
          fi
          if [ ! -s /tmp/rindex.new.json ]; then
            printf '{"schemaVersion":1,"generatedAt":"%s","latest":"%s","releases":[{"version":"%s","date":"%s","manifestUrl":"https://%s.%s/releases/%s/manifest.json"}]}' \
              "$now_iso" "$version_label" "$version_label" "$now_iso" "$B2_BUCKET_NAME" "$B2_ENDPOINT_URL" "$version_label" \
              > /tmp/rindex.new.json
          fi
          index_cache_control="max-age=300,public"
          aws s3 cp /tmp/rindex.new.json "s3://$B2_BUCKET_NAME/releases/.staging/index.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$index_cache_control"
          aws s3 cp "s3://$B2_BUCKET_NAME/releases/.staging/index.json" "s3://$B2_BUCKET_NAME/releases/index.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$index_cache_control"

      - name: Summary of uploaded assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## B2 Upload Summary" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "release-assets/*" > /dev/null; then
            echo "Uploaded the following to https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/:" >> "$GITHUB_STEP_SUMMARY"
            for f in release-assets/*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              echo "- https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/${base}" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "Stable manifest: https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/stable/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-assets present." >> "$GITHUB_STEP_SUMMARY"
          fi
