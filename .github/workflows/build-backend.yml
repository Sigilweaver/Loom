name: Build Backend

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.13'

jobs:
  build-backend:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: backend-linux
            executable-name: backend
          - os: windows-latest
            artifact-name: backend-win
            executable-name: backend.exe
          - os: macos-latest
            artifact-name: backend-mac
            executable-name: backend
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'backend/.python-version'

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: uv sync --all-extras

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 .github/scripts/set-version.py

      - name: Build backend executable
        working-directory: backend
        shell: bash
        run: |
          uv run pyinstaller sigilweaver.spec

      - name: Verify executable exists
        working-directory: backend
        shell: bash
        run: |
          if [ -f "dist/${{ matrix.executable-name }}" ]; then
            echo "Backend executable built successfully"
            ls -lh dist/${{ matrix.executable-name }}
          else
            echo "ERROR: Backend executable not found"
            exit 1
          fi

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: backend/dist/${{ matrix.executable-name }}
          if-no-files-found: error
          retention-days: 7
