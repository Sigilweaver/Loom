name: Build Backend

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11'
    outputs:
      artifact-name:
        description: "Name of the uploaded backend artifact"
        value: ${{ jobs.build-backend.outputs.artifact-name }}

jobs:
  build-backend:
    strategy:
      matrix:
        include:
          - os: [self-hosted, linux]
            artifact-name: backend-linux
            executable-name: sigilweaver-backend
          - os: [self-hosted, windows]
            artifact-name: backend-win
            executable-name: sigilweaver-backend.exe
          - os: macos-latest
            artifact-name: backend-mac
            executable-name: sigilweaver-backend
    
    runs-on: ${{ matrix.os }}
    outputs:
      artifact-name: ${{ matrix.artifact-name }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build backend executable
        working-directory: backend
        shell: bash
        run: |
          pyinstaller sigilweaver.spec

      - name: Verify executable exists
        working-directory: backend
        shell: bash
        run: |
          if [ -f "dist/${{ matrix.executable-name }}" ]; then
            echo "Backend executable built successfully"
            ls -lh dist/${{ matrix.executable-name }}
          else
            echo "ERROR: Backend executable not found"
            exit 1
          fi

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: backend/dist/${{ matrix.executable-name }}
          if-no-files-found: error
          retention-days: 7
