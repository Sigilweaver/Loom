name: Build Releases

on:
  push:
    tags:
      - 'v*'
      - 'nightly*'

permissions:
  contents: write

jobs:
  validate-tag-on-main:
    name: Validate tag points to main
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: |
          git fetch origin main --prune
      - name: Check tag commit is on main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "${ref}" != refs/tags/* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git rev-list -n 1 "${ref}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag commit is contained in origin/main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on origin/main; skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-web-zip:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-web.yml
    with:
      node-version: '22'
    secrets: inherit

  build-linux:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-linux.yml
    with:
      node-version: '22'
    secrets: inherit

  build-macos:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-macos.yml
    with:
      node-version: '22'
    secrets: inherit

  build-windows:
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-windows.yml
    with:
      node-version: '22'
    secrets: inherit

  publish-assets:
    name: Publish to GitHub Release and Backblaze B2
    runs-on: ubuntu-latest
    needs:
      - validate-tag-on-main
      - build-web-zip
      - build-linux
      - build-macos
      - build-windows
    if: ${{ needs.validate-tag-on-main.outputs.run == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Setup Node for publish step
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download web artifact
        if: ${{ needs.build-web-zip.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: web-dist-zip
          path: web-dist-zip

      - name: Download linux artifacts
        if: ${{ needs.build-linux.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: linux-artifacts

      - name: Download macOS artifacts
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: macos-artifacts

      - name: Download Windows artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: windows-artifacts

      - name: Prepare generic filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Windows: prefer NSIS installer (exclude portable if present)
          w_exe=$(ls -1 windows-artifacts/*.exe 2>/dev/null | grep -vi portable | head -n 1 || true)
          if [ -z "${w_exe}" ]; then
            w_exe=$(ls -1 windows-artifacts/*.exe 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "${w_exe}" ]; then
            cp "${w_exe}" release-assets/sigilweaver.exe
          else
            echo "No Windows .exe found in windows-artifacts/"
          fi

          # macOS DMG
          m_dmg=$(ls -1 macos-artifacts/*.dmg 2>/dev/null | head -n 1 || true)
          if [ -n "${m_dmg}" ]; then
            cp "${m_dmg}" release-assets/sigilweaver.dmg
          else
            echo "No macOS .dmg found in macos-artifacts/"
          fi

          # Linux AppImage
          l_app=$(ls -1 linux-artifacts/*.AppImage 2>/dev/null | head -n 1 || true)
          if [ -n "${l_app}" ]; then
            cp "${l_app}" release-assets/sigilweaver.appimage
          else
            echo "No Linux .AppImage found in linux-artifacts/"
          fi

          # Linux Snap
          l_snap=$(ls -1 linux-artifacts/*.snap 2>/dev/null | head -n 1 || true)
          if [ -n "${l_snap}" ]; then
            cp "${l_snap}" release-assets/sigilweaver.snap
          else
            echo "No Linux .snap found in linux-artifacts/"
          fi

          # Web zip
          if [ -f web-dist-zip/dist-web.zip ]; then
            cp web-dist-zip/dist-web.zip release-assets/sigilweaver.zip
          else
            echo "Web dist zip not found at web-dist-zip/dist-web.zip"
          fi

          echo "Prepared files:"
          ls -l release-assets || true

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "release-assets/*" > /dev/null; then
            (cd release-assets && sha256sum * > sha256sum.txt)
            echo "Generated release-assets/sha256sum.txt"
          else
            echo "No files in release-assets to checksum"
          fi

      - name: Upload built artifacts to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-artifacts/*
            macos-artifacts/*
            windows-artifacts/*
            web-dist-zip/dist-web.zip
            release-assets/sha256sum.txt
          fail_on_unmatched_files: false

      - name: Mirror generic assets and manifests to Backblaze B2 (S3 API)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_DEFAULT_REGION: us-east-1
        shell: bash
        run: |
          set -euo pipefail
          # Ensure required B2_* vars are present
          if [ -z "${B2_APPLICATION_KEY_ID:-}" ] || [ -z "${B2_APPLICATION_KEY:-}" ] || [ -z "${B2_BUCKET_NAME:-}" ] || [ -z "${B2_ENDPOINT_URL:-}" ]; then
            echo "B2 secrets not set (need B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME, B2_ENDPOINT_URL). Skipping B2 upload."
            exit 0
          fi

          # Map B2_* env vars to AWS_* for awscli compatibility
          export AWS_ACCESS_KEY_ID="${B2_APPLICATION_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${B2_APPLICATION_KEY}"
          export AWS_DEFAULT_REGION="${B2_DEFAULT_REGION:-us-east-1}"

          # Determine channel (stable for v* tags, nightly for nightly* tags)
          channel="stable"
          if [[ "${GITHUB_REF_NAME}" == nightly* ]]; then channel="nightly"; fi
          now_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version_label="${GITHUB_REF_NAME}"

          # Upload generic assets
          asset_cache_control="max-age=300,public"
          for f in release-assets/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            echo "Uploading $base to B2 bucket $B2_BUCKET_NAME latest via S3 API"
            aws s3 cp "$f" "s3://$B2_BUCKET_NAME/latest/$base" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$asset_cache_control"
          done

          # Upload checksum file if present
          if [ -f release-assets/sha256sum.txt ]; then
            echo "Uploading sha256sum.txt"
            aws s3 cp release-assets/sha256sum.txt "s3://$B2_BUCKET_NAME/latest/sha256sum.txt" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$asset_cache_control"
          fi

          # Build assets array
          assets_json="["
          first=1
          for f in release-assets/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            os="unknown"; id="$ext"; kind="file"
            case "$ext" in
              exe) os="windows"; id="windowsInstaller"; kind="installer" ;;
              dmg) os="macos"; id="macDmg"; kind="image" ;;
              AppImage|Appimage|appimage) os="linux"; id="linuxAppImage"; kind="image" ;;
              snap) os="linux"; id="linuxSnap"; kind="image" ;;
              zip) os="web"; id="webZip"; kind="archive" ;;
            esac
            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
            sha=$(sha256sum "$f" 2>/dev/null | awk '{print $1}')
            url="https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/${base}"
            item="{\"id\":\"$id\",\"os\":\"$os\",\"arch\":\"any\",\"kind\":\"$kind\",\"fileName\":\"$base\",\"url\":\"$url\",\"size\":$size,\"sha256\":\"$sha\"}"
            if [ $first -eq 1 ]; then assets_json="$assets_json$item"; first=0; else assets_json="$assets_json,$item"; fi
          done
          assets_json="$assets_json]"

          mkdir -p release-assets/manifests
          if [ "$channel" = "stable" ]; then
            printf '{"schemaVersion":1,"channel":"stable","version":"%s","date":"%s","commit":"%s","assets":%s,"nightly":{"url":"https://%s.%s/latest/nightly/manifest.json"}}' \
              "$version_label" "$now_iso" "$GITHUB_SHA" "$assets_json" "$B2_BUCKET_NAME" "$B2_ENDPOINT_URL" \
              > release-assets/manifests/manifest.stable.json
            # Publish stable manifest via staging copy
            manifest_cache_control="max-age=60,public"
            versioned_manifest_cache_control="max-age=31536000,public,immutable"
            aws s3 cp release-assets/manifests/manifest.stable.json "s3://$B2_BUCKET_NAME/latest/stable/.staging/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$manifest_cache_control"
            aws s3 cp "s3://$B2_BUCKET_NAME/latest/stable/.staging/manifest.json" "s3://$B2_BUCKET_NAME/latest/stable/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$manifest_cache_control"
            # Versioned manifest and index update
            aws s3 cp release-assets/manifests/manifest.stable.json "s3://$B2_BUCKET_NAME/releases/${version_label}/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$versioned_manifest_cache_control"
            # Update releases/index.json (best-effort)
            if command -v jq >/dev/null 2>&1 && aws s3 cp "s3://$B2_BUCKET_NAME/releases/index.json" /tmp/rindex.json --endpoint-url "https://$B2_ENDPOINT_URL" 2>/dev/null; then
              jq --arg v "$version_label" --arg d "$now_iso" --arg u "https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/releases/${version_label}/manifest.json" \
                 '(.schemaVersion=1) | (.generatedAt=now|toiso8601) | (.latest=$v) | (.releases=((.releases // []) | map(select(.version!=$v)) + [{version:$v,date:$d,manifestUrl:$u}]))' \
                 /tmp/rindex.json > /tmp/rindex.new.json || true
            fi
            if [ ! -s /tmp/rindex.new.json ]; then
              printf '{"schemaVersion":1,"generatedAt":"%s","latest":"%s","releases":[{"version":"%s","date":"%s","manifestUrl":"https://%s.%s/releases/%s/manifest.json"}]}' \
                "$now_iso" "$version_label" "$version_label" "$now_iso" "$B2_BUCKET_NAME" "$B2_ENDPOINT_URL" "$version_label" \
                > /tmp/rindex.new.json
            fi
            index_cache_control="max-age=300,public"
            aws s3 cp /tmp/rindex.new.json "s3://$B2_BUCKET_NAME/releases/.staging/index.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$index_cache_control"
            aws s3 cp "s3://$B2_BUCKET_NAME/releases/.staging/index.json" "s3://$B2_BUCKET_NAME/releases/index.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$index_cache_control"
          else
            printf '{"schemaVersion":1,"channel":"nightly","buildId":"%s","date":"%s","commit":"%s","assets":%s}' \
              "$GITHUB_SHA" "$now_iso" "$GITHUB_SHA" "$assets_json" \
              > release-assets/manifests/manifest.nightly.json
            manifest_cache_control="max-age=60,public"
            aws s3 cp release-assets/manifests/manifest.nightly.json "s3://$B2_BUCKET_NAME/latest/nightly/.staging/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$manifest_cache_control"
            aws s3 cp "s3://$B2_BUCKET_NAME/latest/nightly/.staging/manifest.json" "s3://$B2_BUCKET_NAME/latest/nightly/manifest.json" --endpoint-url "https://$B2_ENDPOINT_URL" --cache-control "$manifest_cache_control"
          fi

      - name: Summary of uploaded assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## B2 Upload Summary" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "release-assets/*" > /dev/null; then
            echo "Uploaded the following to https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/:" >> "$GITHUB_STEP_SUMMARY"
            for f in release-assets/*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              echo "- https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/${base}" >> "$GITHUB_STEP_SUMMARY"
            done
            channel="stable"; if [[ "${GITHUB_REF_NAME}" == nightly* ]]; then channel="nightly"; fi
            if [ "$channel" = "stable" ]; then
              echo "Stable manifest: https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/stable/manifest.json" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Nightly manifest: https://${B2_BUCKET_NAME}.${B2_ENDPOINT_URL}/latest/nightly/manifest.json" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No release-assets present." >> "$GITHUB_STEP_SUMMARY"
          fi
