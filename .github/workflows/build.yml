name: Build Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag-on-main:
    name: Validate tag points to main
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: |
          git fetch origin main --prune
      - name: Check tag commit is on main
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          if [[ "${ref}" != refs/tags/* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git rev-list -n 1 "${ref}")
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag commit is contained in origin/main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on origin/main; skipping build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  build-web-zip:
    if: needs.validate-tag-on-main.outputs.run == 'true'
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-web.yml
    with:
      node-version: '22'
    secrets: inherit

  build-linux:
    if: needs.validate-tag-on-main.outputs.run == 'true'
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-linux.yml
    with:
      node-version: '22'
    secrets: inherit

  build-macos:
    if: needs.validate-tag-on-main.outputs.run == 'true'
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-macos.yml
    with:
      node-version: '22'
    secrets: inherit

  build-windows:
    if: needs.validate-tag-on-main.outputs.run == 'true'
    needs: validate-tag-on-main
    uses: ./.github/workflows/build-windows.yml
    with:
      node-version: '22'
    secrets: inherit

  publish-assets:
    name: Publish to GitHub Release and Backblaze B2
    runs-on: ubuntu-latest
    needs:
      - validate-tag-on-main
      - build-web-zip
      - build-linux
      - build-macos
      - build-windows
    if: needs.validate-tag-on-main.outputs.run == 'true'
    permissions:
      contents: write
    steps:
      - name: Setup Node for publish step
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-zip
          path: web-dist-zip

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: linux-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: macos-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: windows-artifacts

      - name: Prepare generic filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Windows: prefer NSIS installer (exclude portable if present)
          w_exe=$(ls -1 windows-artifacts/*.exe 2>/dev/null | grep -vi portable | head -n 1 || true)
          if [ -z "${w_exe}" ]; then
            w_exe=$(ls -1 windows-artifacts/*.exe 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "${w_exe}" ]; then
            cp "${w_exe}" release-assets/sigilweaver.exe
          else
            echo "No Windows .exe found in windows-artifacts/"
          fi

          # macOS DMG
          m_dmg=$(ls -1 macos-artifacts/*.dmg 2>/dev/null | head -n 1 || true)
          if [ -n "${m_dmg}" ]; then
            cp "${m_dmg}" release-assets/sigilweaver.dmg
          else
            echo "No macOS .dmg found in macos-artifacts/"
          fi

          # Linux AppImage
          l_app=$(ls -1 linux-artifacts/*.AppImage 2>/dev/null | head -n 1 || true)
          if [ -n "${l_app}" ]; then
            cp "${l_app}" release-assets/sigilweaver.appimage
          else
            echo "No Linux .AppImage found in linux-artifacts/"
          fi

          # Linux Snap
          l_snap=$(ls -1 linux-artifacts/*.snap 2>/dev/null | head -n 1 || true)
          if [ -n "${l_snap}" ]; then
            cp "${l_snap}" release-assets/sigilweaver.snap
          else
            echo "No Linux .snap found in linux-artifacts/"
          fi

          # Web zip
          if [ -f web-dist-zip/dist-web.zip ]; then
            cp web-dist-zip/dist-web.zip release-assets/sigilweaver.zip
          else
            echo "Web dist zip not found at web-dist-zip/dist-web.zip"
          fi

          echo "Prepared files:"
          ls -l release-assets || true

      - name: Upload built artifacts to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-artifacts/*
            macos-artifacts/*
            windows-artifacts/*
            web-dist-zip/dist-web.zip
          fail_on_unmatched_files: false

      - name: Mirror generic assets to Backblaze B2 (S3 API)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_DEFAULT_REGION: us-east-1
        shell: bash
        run: |
          set -euo pipefail
          # Ensure required B2_* vars are present
          if [ -z "${B2_APPLICATION_KEY_ID:-}" ] || [ -z "${B2_APPLICATION_KEY:-}" ] || [ -z "${B2_BUCKET_NAME:-}" ] || [ -z "${B2_ENDPOINT_URL:-}" ]; then
            echo "B2 secrets not set (need B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME, B2_ENDPOINT_URL). Skipping B2 upload."
            exit 0
          fi

          # Map B2_* env vars to AWS_* for awscli compatibility
          export AWS_ACCESS_KEY_ID="${B2_APPLICATION_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${B2_APPLICATION_KEY}"
          export AWS_DEFAULT_REGION="${B2_DEFAULT_REGION:-us-east-1}"

          for f in release-assets/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            echo "Uploading $base to B2 bucket $B2_BUCKET_NAME latest via S3 API"
            aws s3 cp "$f" "s3://$B2_BUCKET_NAME/latest/$base" --endpoint-url "https://$B2_ENDPOINT_URL"
          done
