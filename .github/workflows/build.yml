name: Build Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-web-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Ensure zip is installed
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip
      - run: npm run build:web
      - name: Zip web dist
        run: |
          cd dist
          zip -r ../dist-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-zip
          path: dist-web.zip

  build-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Ensure snapcraft is available (for .snap build)
        run: |
          if command -v snap >/dev/null 2>&1; then
            sudo snap install snapcraft --classic || true
          else
            sudo apt-get update -y
            sudo apt-get install -y snapcraft || true
          fi
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-macos:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  publish-assets:
    name: Publish to GitHub Release and Cloudflare R2
    runs-on: ubuntu-latest
    needs:
      - build-web-zip
      - build-linux
      - build-macos
      - build-windows
    permissions:
      contents: write
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-zip
          path: web-dist-zip

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: linux-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: macos-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: windows-artifacts

      - name: Prepare generic filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Windows: prefer NSIS installer (exclude portable if present)
          w_exe=$(ls -1 windows-artifacts/*.exe 2>/dev/null | grep -vi portable | head -n 1 || true)
          if [ -z "${w_exe}" ]; then
            w_exe=$(ls -1 windows-artifacts/*.exe 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "${w_exe}" ]; then
            cp "${w_exe}" release-assets/sigilweaver.exe
          else
            echo "No Windows .exe found in windows-artifacts/"
          fi

          # macOS DMG
          m_dmg=$(ls -1 macos-artifacts/*.dmg 2>/dev/null | head -n 1 || true)
          if [ -n "${m_dmg}" ]; then
            cp "${m_dmg}" release-assets/sigilweaver.dmg
          else
            echo "No macOS .dmg found in macos-artifacts/"
          fi

          # Linux AppImage
          l_app=$(ls -1 linux-artifacts/*.AppImage 2>/dev/null | head -n 1 || true)
          if [ -n "${l_app}" ]; then
            cp "${l_app}" release-assets/sigilweaver.appimage
          else
            echo "No Linux .AppImage found in linux-artifacts/"
          fi

          # Linux Snap
          l_snap=$(ls -1 linux-artifacts/*.snap 2>/dev/null | head -n 1 || true)
          if [ -n "${l_snap}" ]; then
            cp "${l_snap}" release-assets/sigilweaver.snap
          else
            echo "No Linux .snap found in linux-artifacts/"
          fi

          # Web zip
          if [ -f web-dist-zip/dist-web.zip ]; then
            cp web-dist-zip/dist-web.zip release-assets/sigilweaver.zip
          else
            echo "Web dist zip not found at web-dist-zip/dist-web.zip"
          fi

          echo "Prepared files:"
          ls -l release-assets || true

      - name: Upload built artifacts to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-artifacts/*
            macos-artifacts/*
            windows-artifacts/*
            web-dist-zip/dist-web.zip
          fail_on_unmatched_files: false

      - name: Mirror generic assets to Cloudflare R2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${R2_S3_ENDPOINT:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "Cloudflare R2 secrets not set. Skipping R2 upload."
            exit 0
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI not found. Installing..."
            sudo apt-get update -y
            sudo apt-get install -y awscli
          fi
          for f in release-assets/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            echo "Uploading $base to R2 bucket $R2_BUCKET"
            aws s3 cp "$f" "s3://$R2_BUCKET/$base" --endpoint-url "$R2_S3_ENDPOINT"
          done
