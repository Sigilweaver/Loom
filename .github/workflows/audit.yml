# Dependency vulnerability audit for Loom.
#
# Runs pip-audit (server, hub/backend), bun audit (hub/frontend, studio),
# and cargo-audit (studio/tauri) against their respective lockfiles on
# every push/PR that touches them, plus a weekly schedule so advisories
# published after the last dependency change are still caught.

name: Audit

on:
  push:
    branches: ["main"]
    paths:
      - "server/uv.lock"
      - "server/pyproject.toml"
      - "hub/backend/uv.lock"
      - "hub/backend/pyproject.toml"
      - "hub/frontend/bun.lock"
      - "hub/frontend/package.json"
      - "studio/bun.lock"
      - "studio/package.json"
      - "studio/tauri/Cargo.lock"
      - "studio/tauri/Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "server/uv.lock"
      - "server/pyproject.toml"
      - "hub/backend/uv.lock"
      - "hub/backend/pyproject.toml"
      - "hub/frontend/bun.lock"
      - "hub/frontend/package.json"
      - "studio/bun.lock"
      - "studio/package.json"
      - "studio/tauri/Cargo.lock"
      - "studio/tauri/Cargo.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit-server:
    name: pip-audit (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd server && uv export --no-dev --no-emit-project -o requirements.txt
      - run: cd server && uvx pip-audit --strict -r requirements.txt

  pip-audit-hub-backend:
    name: pip-audit (hub/backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd hub/backend && uv export --no-dev --no-emit-project -o requirements.txt
      - run: cd hub/backend && uvx pip-audit --strict -r requirements.txt


  bun-audit-hub-frontend:
    name: bun audit (hub/frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd hub/frontend && bun install --frozen-lockfile
      # No advisories are ignored here. Keep it that way: fix with an in-range
      # lockfile bump or an "overrides" entry in package.json instead.
      - run: cd hub/frontend && bun audit --audit-level=high

  bun-audit-studio:
    name: bun audit (studio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd studio && bun install --frozen-lockfile
      # Transitive advisories are fixed via the "overrides" field in
      # studio/package.json (nanoid, fast-uri, js-yaml, @xmldom/xmldom) and by
      # keeping the minimatch/brace-expansion entries in bun.lock on patched
      # releases. Do not add an --ignore for anything that has a fix.
      #
      # The only ignores are two advisories against extract-zip, which has no
      # patched release at all (the advisories cover <= 2.0.1 and 2.0.1 is the
      # latest version). It is reached only through electron's install-time
      # unpack of the prebuilt runtime archive (electron -> extract-zip), so it
      # runs on developer and CI machines, never in the shipped app. Recent Electron
      # majors replace it; remove both ignores when the Electron major is
      # bumped. Tracked in Sigilweaver/Loom#148.
      - run: >
          cd studio && bun audit --audit-level=high
          --ignore=GHSA-jmr9-qjv8-65gv
          --ignore=GHSA-7pqw-9j4j-h8q3

  cargo-audit:
    name: cargo audit (studio/tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # No advisories are ignored. Unmaintained/unsound warnings from the Tauri
      # and GTK dependency trees are reported as warnings and do not fail the job.
      - run: cd studio/tauri && cargo audit
