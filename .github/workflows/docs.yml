name: Docs

# ci.yml excludes docs/** and **/*.md from its triggers, so its jobs never run
# on a docs-only change. This workflow is the inverse: it runs only when the
# docs site (or the markdown it renders) actually changes, so a docs-only PR
# still gets a build check without paying for the full CI matrix.
on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: ["**"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build:cloudflare
