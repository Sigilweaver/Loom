# =============================================================================
# Sigilweaver Loom Docker Image Build and Push
# =============================================================================
# Builds amd64 Docker images for Hub and Server and pushes them to
# GitHub Container Registry (ghcr.io).
#
# NOTE: sigilyx is installed from PyPI (has manylinux wheels for amd64+arm64).
#
# Triggers:
#   - On release publish: Builds and pushes with version tags. release.yml
#     creates releases as drafts, so this runs when a maintainer publishes one.
#   - Manual dispatch: Allows building with custom version tag
#
# Tags pushed for each image:
#   - Stable release (v1.2.3): 1.2.3, 1.2 and latest
#   - Pre-release (v1.2.3-rc.1, or a release marked as pre-release): only the
#     exact version tag (1.2.3-rc.1); never latest or the major.minor tag
#   - Manual dispatch: the exact version, plus major.minor for a stable version;
#     latest only when the "tag_latest" input is set
# =============================================================================

name: Build Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0 or 1.0.0-rc.1)"
        required: true
        type: string
      tag_latest:
        description: "Also move the latest tag (ignored for pre-release versions)"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

# Prevent overlapping image builds. Two runs for the same release tag (or
# the same workflow_dispatch version input) would race to push identical
# tags to ghcr.io and duplicate cache work.
concurrency:
  group: docker-build-${{ github.event.release.tag_name || github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Build Hub Image
  # ===========================================================================
  build-hub:
    name: Build Hub Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version metadata
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG_LATEST: ${{ github.event.inputs.tag_latest }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            VERSION="${RELEASE_TAG}"
            PRERELEASE="${RELEASE_PRERELEASE}"
            TAG_LATEST=true
          else
            VERSION="${INPUT_VERSION}"
            PRERELEASE=false
            TAG_LATEST="${INPUT_TAG_LATEST}"
          fi
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          # A '-' suffix (1.0.0-rc.1) always means pre-release
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi
          IMAGE_NAME="${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/sigilweaver-loom-hub"

          TAGS="${IMAGE_NAME}:${VERSION}"
          if [ "${PRERELEASE}" != "true" ]; then
            TAGS+=$'\n'"${IMAGE_NAME}:${VERSION%.*}"
            if [ "${TAG_LATEST}" = "true" ]; then
              TAGS+=$'\n'"${IMAGE_NAME}:latest"
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "image=${IMAGE_NAME}"
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} (pre-release: ${PRERELEASE})"
          echo "Tags:"
          echo "${TAGS}"

      - name: Build and push Hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Sigilweaver Loom Hub
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ===========================================================================
  # Build Server Image
  # ===========================================================================
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version metadata
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG_LATEST: ${{ github.event.inputs.tag_latest }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            VERSION="${RELEASE_TAG}"
            PRERELEASE="${RELEASE_PRERELEASE}"
            TAG_LATEST=true
          else
            VERSION="${INPUT_VERSION}"
            PRERELEASE=false
            TAG_LATEST="${INPUT_TAG_LATEST}"
          fi
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          # A '-' suffix (1.0.0-rc.1) always means pre-release
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi
          IMAGE_NAME="${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/sigilweaver-loom-server"

          TAGS="${IMAGE_NAME}:${VERSION}"
          if [ "${PRERELEASE}" != "true" ]; then
            TAGS+=$'\n'"${IMAGE_NAME}:${VERSION%.*}"
            if [ "${TAG_LATEST}" = "true" ]; then
              TAGS+=$'\n'"${IMAGE_NAME}:latest"
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "image=${IMAGE_NAME}"
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} (pre-release: ${PRERELEASE})"
          echo "Tags:"
          echo "${TAGS}"

      - name: Build and push Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Sigilweaver Loom Server
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
