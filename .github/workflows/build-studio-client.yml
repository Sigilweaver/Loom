name: Build Studio Client

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-client:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact-name: linux-client-artifacts
          - os: windows-latest
            platform: win
            artifact-name: windows-client-artifacts
          - os: macos-latest
            platform: mac
            artifact-name: macos-client-artifacts

    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.platform == 'win' && 'windows-signing' || '' }}
    defaults:
      run:
        working-directory: studio
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install studio dependencies
        run: bun install --frozen-lockfile

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: python3 .github/scripts/set-version.py

      - name: Install snapcraft (Linux only)
        if: matrix.platform == 'linux'
        run: |
          if command -v snap >/dev/null 2>&1; then
            sudo snap install snapcraft --classic || true
          else
            sudo apt-get update -y
            sudo apt-get install -y snapcraft || true
          fi

      - name: Build client version
        run: bun run build:${{ matrix.platform }}:client

      - name: Sign Windows executables
        if: matrix.platform == 'win'
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7 # v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: studio/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: studio/dist/*
