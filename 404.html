<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Sigilweaver</title>
    <meta name="description" content="The page you're looking for seems to have vanished into the digital ether. Let us guide you back to the magic.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="assets/sigilweaver-logo.svg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mystic: {
                            900: '#1a0b2e',
                            800: '#2d1b42',
                            700: '#4c2a6b',
                            600: '#6b3fa0',
                            500: '#8b5cf6',
                            400: '#a78bfa',
                            300: '#c4b5fd',
                            200: '#ddd6fe',
                            100: '#f3f0ff'
                        },
                        gold: {
                            500: '#f59e0b',
                            400: '#fbbf24',
                            300: '#fcd34d',
                            200: '#fef3c7'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .floating-orb {
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-orb:nth-child(2) {
            animation-delay: -2s;
        }
        
        .floating-orb:nth-child(3) {
            animation-delay: -4s;
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        .sr-only:focus,
        .focus\:not-sr-only:focus {
            position: static;
            width: auto;
            height: auto;
            padding: inherit;
            margin: inherit;
            overflow: visible;
            clip: auto;
            white-space: normal;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-mystic-900 to-mystic-700 text-white min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Skip Link -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-gold-500 text-mystic-900 px-4 py-2 rounded-md z-50 font-semibold">
        Skip to main content
    </a>
    
    <!-- Floating Background Elements -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="floating-orb absolute top-1/4 left-1/4 w-20 h-20 bg-gradient-to-r from-mystic-500 to-gold-400 rounded-full opacity-20"></div>
        <div class="floating-orb absolute top-3/4 right-1/4 w-32 h-32 bg-gradient-to-r from-gold-400 to-mystic-500 rounded-full opacity-15"></div>
        <div class="floating-orb absolute top-1/2 left-3/4 w-16 h-16 bg-gradient-to-r from-mystic-400 to-gold-300 rounded-full opacity-25"></div>
    </div>
    
    <!-- Main Content -->
    <main id="main-content" class="text-center z-10 px-6 max-w-2xl mx-auto">
        <div class="mb-8">
            <div class="inline-flex items-center space-x-3 mb-6">
                <img src="assets/sigilweaver-logo.svg" alt="Sigilweaver Logo" width="48" height="48" class="opacity-90">
                <span class="text-2xl font-bold text-mystic-200">Sigilweaver</span>
            </div>
        </div>
        
        <div class="text-8xl md:text-9xl font-bold mb-6 bg-gradient-to-b from-mystic-300 to-mystic-600 bg-clip-text text-transparent">
            404
        </div>
        
        <h1 class="text-3xl md:text-4xl font-bold mb-4 text-mystic-200">
            Lost in the Digital Realm
        </h1>
        
        <p class="text-lg md:text-xl text-mystic-300 mb-8 leading-relaxed">
            The page you seek has vanished into the digital ether. Even our most powerful data weaving spells cannot locate it. 
            But fear not—let us guide you back to the path of enlightenment.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-12">
            <a href="/" class="bg-gradient-to-r from-mystic-600 to-mystic-500 hover:from-mystic-500 hover:to-mystic-400 px-8 py-4 rounded-lg text-lg font-semibold transition-all transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gold-400 focus:ring-opacity-50">
                Return Home
            </a>

    </main>
    
    <!-- Simple JavaScript for error reporting -->
    <script>
        // Log 404 errors for analytics
        if (window.navigator && 'sendBeacon' in navigator) {
            const errorData = {
                type: '404',
                url: window.location.href,
                referrer: document.referrer,
                timestamp: Date.now()
            };
            
            // In production, you would send this to your analytics endpoint
            console.log('404 Error logged:', errorData);
        }
        
        // Focus management for accessibility
        document.addEventListener('DOMContentLoaded', function() {
            const mainContent = document.getElementById('main-content');
            if (mainContent) {
                mainContent.focus();
            }
        });
    </script>
</body>
</html>
