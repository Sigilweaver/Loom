                            700: '#4c2a6b',
                            600: '#6b3fa0',
                            500: '#8b5cf6',

                    }

            }
        }

            <svg width="80" height="80" viewBox="0 0 32 32" class="text-mystic-400 mx-auto mb-4">

        <h1 class="text-6xl font-bold mb-4 bg-gradient-to-r from-mystic-300 via-gold-400 to-mystic-300 bg-clip-text text-transparent">
            404
        </h1>
        
        <h2 class="text-2xl font-semibold text-mystic-200 mb-4">

        <p class="text-mystic-400 mb-8 leading-relaxed">

        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="bg-gradient-to-r from-mystic-600 to-mystic-500 hover:from-mystic-500 hover:to-mystic-400 px-6 py-3 rounded-lg font-semibold transition-all">

            <a href="/demo" class="border-2 border-mystic-500 hover:border-gold-400 px-6 py-3 rounded-lg font-semibold transition-all hover:bg-mystic-500/10">
