[project]
name = "sigilweaver-loom-server"
version = "0.0.0-dev"
description = "Backend service for Sigilweaver Loom workflow execution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "polars>=1.43.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "fastexcel>=0.10.0",
    "xlsxwriter>=3.1.0",
    "connectorx>=0.3.0",
    "cryptography>=46.0.3",
    "pyarrow>=22.0.0",
    "httpx>=0.28.1",
    "openqvd>=1.1.0",
    "sigilyx",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "xlwt>=1.3.0",
]
build = ["pyinstaller>=6.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tool config models mirror the camelCase JSON contract shared with the
# frontend / AI layer (e.g. sortColumns, variableName, nullsFirst), so N815
# (mixedCase in class scope) is intentional for these Pydantic fields.
"app/domain/tools/implementations/*.py" = ["N815"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
