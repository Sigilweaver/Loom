[package]
name = "sigilweaver-studio"
version = "0.0.0"
description = "Sigilweaver Studio - Visual Workflow Designer"
authors = ["Sigilweaver Team"]
license = "AGPL-3.0"
repository = "https://github.com/Sigilweaver/Sigilweaver"
edition = "2021"

[lib]
name = "sigilweaver_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
whoami = "1"

# Stronghold for secure credential storage
# iota-stronghold provides encrypted storage similar to OS keychains
# tauri-plugin-stronghold = "2"  # Uncomment when ready to implement

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
