[package]
name = "sigilweaver-loom-studio"
version = "0.0.0-dev"
description = "Sigilweaver Loom Studio - Visual Workflow Designer"
authors = ["Sigilweaver Loom Team"]
license = "AGPL-3.0"
repository = "https://github.com/Sigilweaver/Loom"
edition = "2021"

[lib]
name = "sigilweaver_loom_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
whoami = "2"

# OS-native secure credential storage (Keychain / Credential Manager / Secret Service).
# Database passwords are stored here, never in the plaintext connections store.
# Linux builds require system packages: pkg-config and libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
