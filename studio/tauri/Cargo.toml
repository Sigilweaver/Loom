[package]
name = "sigilweaver-loom-studio"
version = "0.0.0-dev"
description = "Sigilweaver Loom Studio - Visual Workflow Designer"
authors = ["Sigilweaver Loom Team"]
license = "AGPL-3.0"
repository = "https://github.com/Sigilweaver/Loom"
edition = "2021"

[lib]
name = "sigilweaver_loom_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
whoami = "2"

# One app instance at a time: a second launch focuses the first instead of
# starting (and reaping) a second server. Desktop targets only.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

# Process-group signalling for the bundled server (see src/commands/backend.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job object that ties the bundled server's process tree to the app on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# OS-native secure credential storage (Keychain / Credential Manager / Secret Service).
# Database passwords are stored here, never in the plaintext connections store.
# Linux builds require system packages: pkg-config and libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enabled for "Full" desktop builds that bundle the PyInstaller server as a
# Tauri sidecar (built with `tauri.conf.full.json`). Client builds omit this
# feature and never spawn a server. See src/commands/backend.rs.
bundled-server = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
