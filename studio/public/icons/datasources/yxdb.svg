<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- YXDB file format icon -->
  <!-- Hexagonal shape inspired by Alteryx branding -->
  <defs>
    <linearGradient id="yxdb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="20" ry="20" fill="url(#yxdb-grad)"/>
  <!-- Database cylinder shape -->
  <ellipse cx="64" cy="42" rx="32" ry="10" fill="none" stroke="white" stroke-width="4"/>
  <path d="M32 42 v 44 c 0 5.5 14.3 10 32 10 s 32-4.5 32-10 v-44" fill="none" stroke="white" stroke-width="4"/>
  <ellipse cx="64" cy="86" rx="32" ry="10" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>
  <!-- Middle ellipse (data rows) -->
  <ellipse cx="64" cy="64" rx="32" ry="10" fill="none" stroke="white" stroke-width="3" opacity="0.35"/>
  <!-- YX text -->
  <text x="64" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="white" opacity="0.9">YX</text>
</svg>
