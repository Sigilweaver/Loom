# =============================================================================
# Sigilweaver Loom Production Docker Compose
# =============================================================================
#
# Usage:
#   1. Copy .env.example to .env and fill in required values
#   2. docker compose up -d
#   3. Scale servers: docker compose up -d --scale server=3
#
# Security Features:
#   - Read-only root filesystems
#   - Non-root users
#   - Docker secrets for sensitive data
#   - Network isolation
#   - Resource limits
#
# =============================================================================

name: sigilweaver-loom

# =============================================================================
# Secrets (recommended for production)
# =============================================================================
# Create secrets with:
#   echo "your-secret-value" | docker secret create session_secret -
#   echo "your-secret-value" | docker secret create secret_key -
#   echo "your-fernet-key" | docker secret create connection_encryption_key -
#   echo "your-secret-value" | docker secret create server_registration_secret -
#   echo "your-password" | docker secret create postgres_password -
#
# For non-swarm mode, use file-based secrets (see below)
# =============================================================================
secrets:
  session_secret:
    file: ${SECRETS_DIR:-./.secrets}/session_secret
  secret_key:
    file: ${SECRETS_DIR:-./.secrets}/secret_key
  connection_encryption_key:
    file: ${SECRETS_DIR:-./.secrets}/connection_encryption_key
  server_registration_secret:
    file: ${SECRETS_DIR:-./.secrets}/server_registration_secret
  postgres_password:
    file: ${SECRETS_DIR:-./.secrets}/postgres_password

services:
  # ===========================================================================
  # PostgreSQL (optional - can use external database via DATABASE_URL)
  # ===========================================================================
  postgres:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigilweaver_loom}
      # In production: reads password from Docker secret file
      # In development: override file sets POSTGRES_PASSWORD env var instead
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-sigilweaver_loom_hub}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sigilweaver-loom-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigilweaver_loom}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to expose PostgreSQL externally (not recommended for production)
    # ports:
    #   - "5432:5432"

    # ===========================================================================
    # Hub - Orchestration, user management, and frontend
    # ===========================================================================
  hub:
    image: ghcr.io/sigilweaver/sigilweaver-loom-hub:${VERSION:-latest}
    build:
      context: ..
      dockerfile: hub/Dockerfile
      args:
        VERSION: ${VERSION:-latest}
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
      # Use host network for builds in dev containers (DNS resolution)
      network: host
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - session_secret
      - secret_key
      - connection_encryption_key
      - server_registration_secret
      - postgres_password
    environment:
      # Runtime mode - enforces secret validation at startup
      ENVIRONMENT: production

      # Database - password read from secret file at runtime by entrypoint
      DATABASE_URL_TEMPLATE: postgresql+asyncpg://${POSTGRES_USER:-sigilweaver_loom}:__PASSWORD__@postgres:5432/${POSTGRES_DB:-sigilweaver_loom_hub}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

      # Security secrets (read from Docker secrets)
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SECRET_KEY_FILE: /run/secrets/secret_key
      CONNECTION_ENCRYPTION_KEY_FILE: /run/secrets/connection_encryption_key
      SERVER_REGISTRATION_SECRET_FILE: /run/secrets/server_registration_secret

      # Fallback to env vars if secrets not mounted (for backwards compatibility)
      SESSION_SECRET: ${SESSION_SECRET:-}
      SECRET_KEY: ${SECRET_KEY:-}
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:-}
      SERVER_REGISTRATION_SECRET: ${SERVER_REGISTRATION_SECRET:-}

      # CORS - defaults to allowing Studio
      # Set CORS_ORIGINS='["https://app.example.com"]' for production

      # Workflow storage
      WORKFLOW_STORAGE_PATH: /app/data/workflows

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json

      # Static files path for bundled frontend
      STATIC_FILES_PATH: /app/static
    tmpfs:
      - /tmp:mode=1777,size=100M
    volumes:
      - hub_workflows:/app/data/workflows
    networks:
      - sigilweaver-loom-internal
      - sigilweaver-loom-external
    ports:
      - "${HUB_PORT:-25802}:25802"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:25802/api/v1/health" ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ===========================================================================
  # Server - Workflow execution (stateless, horizontally scalable)
  # ===========================================================================
  server:
    image: ghcr.io/sigilweaver/sigilweaver-loom-server:${VERSION:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        VERSION: ${VERSION:-latest}
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
      # Use host network for builds in dev containers (DNS resolution)
      network: host
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      hub:
        condition: service_healthy
    secrets:
      - server_registration_secret
    environment:
      # Hub connection
      HUB_URL: http://hub:25802
      HUB_REGISTRATION_SECRET_FILE: /run/secrets/server_registration_secret
      # Fallback to env var for backwards compatibility
      HUB_REGISTRATION_SECRET: ${SERVER_REGISTRATION_SECRET:-}
      SERVER_NAME: ${SERVER_NAME:-server-${HOSTNAME:-1}}

      # Authentication
      AUTH_MODE: hub

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      CORS_MODE: production

      # Storage paths (must be writable inside container)
      AUDIT_PATH: /app/data/audit
      ARCHIVE_PATH: /app/data/archives
      CACHE_PATH: /app/data/cache

      # Disable features that require local storage
      AUDIT_ENABLED: "false"
      ARCHIVE_ENABLED: "false"
      CACHE_ENABLED: "false"
    tmpfs:
      - /tmp:mode=1777,size=100M
      - /app/data/cache:mode=1777,size=500M
    volumes:
      # Mount data files (read-only for security)
      - server_data:/app/data/files:ro
    networks:
      - sigilweaver-loom-internal
      - sigilweaver-loom-external
    # Port exposed for direct Studio -> Server connections (bypassing Hub)
    # Remove this section if all traffic should route through Hub
    ports:
      - "${SERVER_PORT:-25811}:25811"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:25811/api/health" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    # Scale with: docker compose up -d --scale server=3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal network for Hub <-> Server <-> PostgreSQL communication
  sigilweaver-loom-internal:
    driver: bridge
    internal: true

  # External network for Hub to receive requests
  sigilweaver-loom-external:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: sigilweaver_loom_postgres_data
  hub_workflows:
    name: sigilweaver_loom_hub_workflows
  server_data:
    name: sigilweaver_loom_server_data
